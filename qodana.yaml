# Qodana — docs/12 §2.7. Read by .github/workflows/qodana.yml.
#
# qodana-js is JetBrains' JavaScript/TypeScript linter; it needs the Ultimate
# licence that QODANA_TOKEN carries. Native mode (no Docker image): the
# workflow installs node_modules on the runner first, with install scripts
# off, and the analysis reads them from there.
version: "1.0"
linter: qodana-js
withinDocker: false

profile:
  name: qodana.recommended

# What is not code, or not ours: byte-exact browser samples (malformed on
# purpose), build and coverage output, screenshots, store copy, prose.
exclude:
  - name: All
    paths:
      - tests/fixtures
      - .output
      - .wxt
      - coverage
      - capture
      - store
      - docs
      - legal
  # Inspections switched off after the first run (2026-11-18), each because it
  # contradicts a rule of this repository rather than finding a defect:
  #
  # Doc comments here are prose (docs/10 §6). `@param` tags appear only where a
  # `// @ts-check` script needs a type, so "every parameter described" is not
  # the convention — 22 of the first run's 27 findings.
  - name: JSCommentMatchesSignature
  # A CRC-32 table for PNG chunks is bitwise by definition.
  - name: JSBitwiseOperatorUsage
    paths:
      - scripts/gen-icons.mjs
  # The dark palette is declared twice on purpose: once under the
  # prefers-color-scheme query, once for the explicit theme switch (docs/06 §1).
  - name: DuplicatedCode
    paths:
      - src/styles/tokens.css

# Clean since 2026-11-18 (docs/12 §2.7): any new finding turns this workflow
# red, so it is fixed or switched off here with its reason — never left
# standing to be ignored. Not a required check.
failureConditions:
  severityThresholds:
    any: 0
