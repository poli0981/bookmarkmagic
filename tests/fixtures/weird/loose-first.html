<!DOCTYPE NETSCAPE-Bookmark-file-1>
<!-- Hand-made: a loose bookmark BEFORE the wrapper list, no </DT> anywhere.
     The HTML parser nests the whole wrapper <DL> inside that bookmark's <DT>;
     v1.0.x imported only "Loose first" and silently dropped the rest. -->
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<TITLE>Bookmarks</TITLE>
<H1>Bookmarks</H1>
<DT><A HREF="https://loose.example/" ADD_DATE="1700000000">Loose first</A>
<DL><p>
    <DT><H3 ADD_DATE="1700000001">Folder</H3>
    <DL><p>
        <DT><A HREF="https://inside.example/" ADD_DATE="1700000002">Inside</A>
    </DL><p>
    <DT><A HREF="https://after.example/" ADD_DATE="1700000003">After</A>
</DL><p>
