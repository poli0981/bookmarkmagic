# SonarCloud — CI-based analysis (docs/12 §2.5). Read by
# .github/workflows/sonarcloud.yml; Automatic Analysis must stay OFF in the
# SonarCloud project (Administration → Analysis Method), or the scan errors out.
sonar.projectKey=poli0981_bookmarkmagic
sonar.organization=poli0981
sonar.projectName=BookmarkMagic
sonar.sourceEncoding=UTF-8

# What ships, plus the repo tooling that guards it.
sonar.sources=src,scripts
# Icons and the _locales message catalogues are data, not code.
sonar.exclusions=src/public/**

sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts
# Fixtures are byte-exact samples of what browsers emit — malformed on purpose
# (a no-doctype HTML file is a test case, not a bug), never something to "fix".
sonar.test.exclusions=tests/fixtures/**

# Coverage scope mirrors docs/11 §1: components, entrypoints and repo scripts
# are verified by the manual QA pass and their own script tests, not by line
# coverage. Everything else in src/ is unit-tested and counted.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/entrypoints/**,src/lib/components/**,**/*.svelte,scripts/**

# The three locale dictionaries are parallel by design (en is the schema, vi/ja
# `satisfies Dict`); their "duplication" is the i18n contract working.
sonar.cpd.exclusions=src/lib/i18n/locales/**
