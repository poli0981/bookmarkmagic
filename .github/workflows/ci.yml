# Caller stub — docs/12 §2.1.
#
# The `quality` job is local because the ops reusable runs NO quality gates at
# all: its entire surface is install → build → assert manifest_version == 3 →
# zip → upload. Lint, type-check, knip, coverage, audit and the grep gate are
# ours.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: no dependency runs code at install time. `wxt prepare`
      # (our postinstall) generates .wxt/tsconfig.json, which tsconfig.json
      # extends, so it runs explicitly from the local binary.
      - run: npm ci --ignore-scripts
      - run: npx --no-install wxt prepare

      - run: npm run lint # biome check .
      - run: npm run check # svelte-check (TS 6 API) + tsc (TS 7) + scripts checkJs
      - run: npm run knip
      - run: npm run coverage # vitest --coverage, thresholds per docs/11 §1
      - run: npm run guard # the zero-network / no-raw-HTML gate, docs/08 §3

      # Zero runtime dependencies is a public claim (README, docs/09 T5); this
      # is the check that keeps it true. Dev-only advisories are tracked by
      # Dependabot and docs/09 §3.1, not here.
      - run: npm audit --omit=dev --audit-level=low

      # The unit test proves what wxt.config.ts ASKS for. Only this proves what
      # WXT actually emitted — a dev build of the same config carries
      # tabs/scripting/host_permissions that never appear in the config file.
      - run: npm run build
      - run: npm run check:manifest

  windows:
    # Not a required check. The owner develops on Windows, and the paths that
    # only break there — drive letters and percent-encoding in script paths,
    # CRLF in a checkout — had no CI coverage at all.
    name: Windows smoke (guard + unit tests)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install wxt prepare
      - run: npm run guard
      - run: npm test

  build:
    name: Build + package
    needs: quality
    # No `secrets:` here — the reusable declares no secrets block at all, and
    # passing a named secret to it is a workflow-compile error.
    uses: poli0981/.github/.github/workflows/reusable-chrome-extension.yml@main
    permissions:
      # `contents: write`, not `read`, even though nothing here writes.
      #
      # The reusable has two mutually exclusive jobs: `build` (contents: read,
      # `if: !inputs.release`) and `release` (contents: write, `if:
      # inputs.release`). GitHub validates the caller's grant against EVERY job
      # the reusable declares, BEFORE evaluating any `if:` — so passing
      # `release: false` does not exempt us from the release job's requirement.
      # Granting only `contents: read` makes the whole run fail at startup with
      # no jobs and no log, which is how this was found (docs/12 §2.1's sample
      # had the same too-narrow grant).
      contents: write
    with:
      # All four are required in practice. Leaving package-manager at its
      # 'none' default skips install and build, then fails on
      # `test -f ./manifest.json` — a file WXT never writes to the repo root.
      package-manager: 'npm'
      # A string input, so it cannot read .nvmrc — keep it equal by hand
      # (docs/01 §2).
      node-version: '26'
      build-command: 'npm run build'
      source-dir: '.output/chrome-mv3'
      release: false
