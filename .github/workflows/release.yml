# Release — docs/12 §2.3.
#
# Standalone rather than the ops reusable: the reusable's `release` job only
# runs `gh release create --generate-notes`. It produces no SHA256SUMS.txt
# (required by docs/09 §5), performs no store submission, and exposes no
# `outputs:`, so a caller cannot reference the zip it built.
#
# Least privilege first. `build` installs, runs every gate and packages with a
# READ-ONLY token; only `publish`, which installs nothing and runs no
# repository code, ever holds `contents: write`. Before the split one job ran
# `npm ci` — every dependency's install script plus our own tests — while
# holding a write token that checkout had also left in .git/config.
#
# Since v1.3.0 there are three release files: the Chromium package (the Chrome
# Web Store AND Edge Add-ons take it), the Firefox package, and the sources
# archive AMO reviews (docs/08 §9, docs/13 §1c). And three store jobs, one per
# store, each off until its repo variable says otherwise (docs/12 §3).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Gate + package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install wxt prepare

      # The same gates as CI. A tag must never ship what a PR would have
      # blocked — pushing a tag skips the CI workflow's branch triggers.
      - run: npm run lint
      - run: npm run check
      - run: npm run knip
      - run: npm run coverage
      - run: npm run guard
      - run: npm run check:licenses
      - run: npm audit --omit=dev --audit-level=low

      - run: npm run zip # → .output/<name>-<version>-chrome.zip (Chrome Web Store, Edge Add-ons)
      - run: npm run zip:firefox # → …-firefox.zip and …-sources.zip (Firefox Add-ons)

      # Gate the artifacts, not just the config they were built from. A tag is
      # the last point at which an unintended permission can still be stopped.
      - run: npm run check:manifest
      - run: npm run check:manifest -- --browser firefox

      - name: Verify tag matches both manifests
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for target in chrome firefox; do
            MANIFEST_VERSION=$(jq -r '.version' ".output/${target}-mv3/manifest.json")
            test "$MANIFEST_VERSION" = "$TAG_VERSION" \
              || { echo "::error::tag $TAG_VERSION != $target manifest $MANIFEST_VERSION"; exit 1; }
          done

      # Staged in a plain directory: upload-artifact skips hidden paths by
      # default, and `.output` is one. Each file by its exact name: a glob would
      # pass with one of the three missing.
      - name: Stage the release files
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          for file in "bookmarkmagic-${VERSION}-chrome.zip" \
                      "bookmarkmagic-${VERSION}-firefox.zip" \
                      "bookmarkmagic-${VERSION}-sources.zip"; do
            test -f ".output/$file" || { echo "::error::missing release file $file"; exit 1; }
            cp ".output/$file" dist/
          done
          (cd dist && sha256sum bookmarkmagic-*.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release — the only write in this file
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist

      # The bytes about to be published are the bytes the build job hashed.
      - name: Re-verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      # Idempotent on purpose. `gh release create` fails outright if a Release
      # for the tag already exists, so any failure AFTER this step — a store
      # job, realistically — used to strand the tag: re-running could not get
      # past this line (docs/13 §7).
      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists — re-uploading assets."
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
              --verify-tag --generate-notes
          fi

  # --- Stores (docs/12 §3) -------------------------------------------------
  #
  # One job per store, so a store's credentials never share a runner with
  # another's and one store refusing an upload does not stop the others. Each
  # runs in a GitHub Environment that holds only its own secrets (give it the
  # owner as required reviewer), is off until its repo VARIABLE is 'true' (a
  # secret is not allowed in a job-level `if:`), and installs only
  # tools/publish — publish-browser-extension and its three dependencies, from
  # their own lockfile, scripts off — not the dev toolchain: a job's secrets
  # are readable by everything on its runner. Never re-run a store job that
  # succeeded: every store refuses a version number it has already seen.

  # A sparse checkout of tools/publish still brings the repository's root files
  # (cone mode), .nvmrc among them.
  store-chrome:
    name: Publish to Chrome Web Store
    needs: publish
    if: vars.CWS_AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools/publish
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --prefix tools/publish
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist
      # Against the SHA256SUMS.txt of the published Release — not the copy that
      # travelled in the same artifact — and by exact name, so a missing file
      # fails here rather than passing a check that skipped it.
      - name: Check against the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --dir published
          cd dist
          for file in "bookmarkmagic-${VERSION}-chrome.zip"; do
            grep -F "  $file" ../published/SHA256SUMS.txt | sha256sum -c -
          done
      - name: Submit
        env:
          # API v2: v1.1 was shut down on 2026-10-15. Set explicitly — the tool
          # still defaults to v1.1.
          CHROME_API_VERSION: v2
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ./tools/publish/node_modules/.bin/publish-extension \
            --chrome-zip "dist/bookmarkmagic-${GITHUB_REF_NAME#v}-chrome.zip"

  store-firefox:
    name: Publish to Firefox Add-ons
    needs: publish
    if: vars.AMO_AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firefox-add-ons
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools/publish
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --prefix tools/publish
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist
      # Against the SHA256SUMS.txt of the published Release — not the copy that
      # travelled in the same artifact — and by exact name, so a missing file
      # fails here rather than passing a check that skipped it.
      - name: Check against the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --dir published
          cd dist
          for file in "bookmarkmagic-${VERSION}-firefox.zip" "bookmarkmagic-${VERSION}-sources.zip"; do
            grep -F "  $file" ../published/SHA256SUMS.txt | sha256sum -c -
          done
      - name: Submit
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
          # Desktop only: Firefox for Android has no bookmarks API (docs/08 §9).
          FIREFOX_COMPATIBILITY: firefox
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ./tools/publish/node_modules/.bin/publish-extension \
            --firefox-zip "dist/bookmarkmagic-${VERSION}-firefox.zip" \
            --firefox-sources-zip "dist/bookmarkmagic-${VERSION}-sources.zip"

  store-edge:
    name: Publish to Microsoft Edge Add-ons
    needs: publish
    if: vars.EDGE_AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: edge-add-ons
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools/publish
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --prefix tools/publish
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist
      # Against the SHA256SUMS.txt of the published Release — not the copy that
      # travelled in the same artifact — and by exact name, so a missing file
      # fails here rather than passing a check that skipped it.
      - name: Check against the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --dir published
          cd dist
          for file in "bookmarkmagic-${VERSION}-chrome.zip"; do
            grep -F "  $file" ../published/SHA256SUMS.txt | sha256sum -c -
          done
      - name: Submit
        env:
          # API v1.1 keys expire every 72 days (docs/12 §3).
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          # Edge Add-ons takes the Chromium package unchanged (docs/08 §10).
          ./tools/publish/node_modules/.bin/publish-extension \
            --edge-zip "dist/bookmarkmagic-${GITHUB_REF_NAME#v}-chrome.zip"

  # A job INSIDE this workflow, not an `on: release: [published]` caller.
  # A Release created by `gh release create` under the default GITHUB_TOKEN
  # emits no event that starts new workflow runs, so an event-driven caller
  # would silently never fire.
  announce:
    needs: publish
    # A Discord notification is not part of the release, so it can never turn a
    # good release red (docs/12 §2.3). Gated on a repo VARIABLE — GitHub REJECTS
    # `continue-on-error` on a job that calls a reusable workflow, which makes
    # the whole file a startup_failure with zero jobs and no log.
    if: vars.DISCORD_ANNOUNCE == 'true'
    uses: poli0981/.github/.github/workflows/announce-release.yml@main
    permissions:
      contents: read
    with:
      # REQUIRED here: the reusable resolves `TAG="${INPUT_TAG:-$EVENT_TAG}"`
      # with EVENT_TAG = github.event.release.tag_name — empty under
      # `on: push: tags` — so without this the job exits 1 and never announces.
      tag_override: ${{ github.ref_name }}
    # Named, not `inherit`: the reusable is pinned to a moving branch, so it gets
    # only the two webhooks it reads — never the store or SONAR secrets. The
    # names also differ: this repo stores RELEASES_WEBHOOK / REPO_WEBHOOK, while
    # the reusable reads DISCORD_* — with `inherit` it received neither and would
    # have failed on "No webhooks configured" the day DISCORD_ANNOUNCE was set.
    secrets:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.RELEASES_WEBHOOK }}
      DISCORD_REPO_WEBHOOK: ${{ secrets.REPO_WEBHOOK }}
